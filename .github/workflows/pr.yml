name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    # ci.yml now triggers itself for PRs into main/monarch-baseline; this
    # wrapper only covers PRs targeting other branches so nothing double-runs.
    branches-ignore:
      - main
      - monarch-baseline
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'charts/**'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
